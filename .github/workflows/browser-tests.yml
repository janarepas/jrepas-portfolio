name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run all seven suites
        shell: bash
        env:
          TEST_BASE_URL: http://127.0.0.1:8000
        run: npm run test:all 2>&1 | tee browser-tests.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: |
            browser-tests.log
            server.log
          if-no-files-found: ignore
          retention-days: 7

[package]
name = "jrepas-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.104"
js-sys = "=0.3.81"
web-sys = { version = "=0.3.81", features = ["Window", "Document", "Element", "HtmlElement", "HtmlSelectElement", "NodeList", "Navigator", "Storage", "MediaQueryList", "MediaQueryListEvent", "Event", "KeyboardEvent", "EventTarget", "Location", "console"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
